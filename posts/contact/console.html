<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teks Editor dengan Eruda</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 1rem;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      height: 95vh;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #0f172a;
    }
    .editor-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 0.75rem;
    }
    textarea {
      flex: 1;
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      font-family: monospace;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      resize: none;
      box-sizing: border-box;
      background: #ffffff;
    }
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .toolbar {
      display: flex;
      gap: 0.5rem;
    }
    button {
      background-color: #2563eb;
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 500;
    }
    button:active {
      background-color: #1d4ed8;
    }
    button.secondary {
      background-color: #64748b;
    }
  </style>
</head>
<body>

  <h2>Teks Editor Sederhana</h2>
  
  <div class="editor-container">
    <textarea id="myEditor" placeholder="Ketik catatan atau kode di sini..."></textarea>
    
    <div class="toolbar">
      <button onclick="simpanTeks()">Simpan Teks</button>
      <button class="secondary" onclick="muatTeks()">Muat Ulang</button>
      <button class="secondary" onclick="hapusTeks()">Bersihkan</button>
    </div>
  </div>

  <!-- Memuat Eruda DevTools dari CDN -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    // Inisialisasi Eruda agar tombol melayang muncul di layar HP
    eruda.init();

    const editor = document.getElementById('myEditor');

    // Fungsi menyimpan teks ke localStorage dan mencatat log ke Eruda
    function simpanTeks() {
      const teks = editor.value;
      localStorage.setItem('savedText', teks);
      console.log('Berhasil menyimpan teks:', teks.substring(0, 30) + (teks.length > 30 ? '...' : ''));
      alert('Teks berhasil disimpan!');
    }

    // Fungsi memuat teks dari localStorage
    function muatTeks() {
      const saved = localStorage.getItem('savedText') || '';
      editor.value = saved;
      console.info('Teks dimuat ulang dari localStorage. Panjang karakter:', saved.length);
    }

    // Fungsi membersihkan editor
    function hapusTeks() {
      if (confirm('Yakin ingin menghapus semua teks?')) {
        editor.value = '';
        localStorage.removeItem('savedText');
        console.warn('Editor dibersihkan dan memori penyimpanan dikosongkan.');
      }
    }

    // Muat otomatis saat halaman dibuka
    window.onload = function() {
      muatTeks();
      console.log('Aplikasi Teks Editor dan Eruda siap digunakan.');
    };
  </script>

</body>
</html>
