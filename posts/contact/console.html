<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live HTML Editor & Eruda Inspector</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #1e293b;
      color: #f8fafc;
    }
    header {
      padding: 0.6rem 1rem;
      background: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    .actions {
      display: flex;
      gap: 0.5rem;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }
    button:active { background: #1d4ed8; }
    button.btn-clear { background: #475569; }
    .workspace {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }
    .editor-pane {
      height: 45%;
      display: flex;
      flex-direction: column;
      border-bottom: 2px solid #334155;
    }
    .pane-label {
      background: #334155;
      color: #cbd5e1;
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    textarea {
      flex: 1;
      width: 100%;
      background: #0f172a;
      color: #e2e8f0;
      border: none;
      padding: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      resize: none;
      outline: none;
    }
    .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <h1>Live Editor + Eruda</h1>
    <div class="actions">
      <button type="button" id="btnRun">▶ Jalankan</button>
      <button type="button" class="btn-clear" id="btnClear">Reset</button>
    </div>
  </header>

  <div class="workspace">
    <div class="editor-pane">
      <div class="pane-label">Kode HTML / JS / CSS</div>
      <textarea id="codeEditor" spellcheck="false" placeholder="Tulis kode HTML, CSS, atau JavaScript di sini..."><!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 1rem; color: #222; }
    .box { padding: 1rem; background: #e0f2fe; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Halo dari dalam Editor!</h2>
    <p>Ketuk ikon Eruda di pojok kanan bawah untuk mengecek elemen &amp; console khusus isi halaman ini.</p>
    <button onclick="console.log('Log dari hasil editor!'); tesError();">Tes Log &amp; Error</button>
  </div>

  <script>
    console.info('Halaman preview berhasil dimuat.');
    function tesError() {
      console.error('Contoh error dari kode di dalam teks editor!');
    }
  </script>
</body>
</html></textarea>
    </div>

    <div class="preview-pane">
      <div class="pane-label">Hasil &amp; Source Terisolasi (Eruda Aktif di Sini)</div>
      <iframe id="previewFrame" title="Preview Output"></iframe>
    </div>
  </div>

  <script>
    const editor = document.getElementById('codeEditor');
    const frame = document.getElementById('previewFrame');
    const btnRun = document.getElementById('btnRun');
    const btnClear = document.getElementById('btnClear');

    function jalankanKode() {
      let userCode = editor.value;

      // Menggunakan concatenation biasa agar tidak memicu syntax error newline/closing tag
      const erudaSnippet = 
        '<' + 'script src="https://cdn.jsdelivr.net/npm/eruda"><' + '/script>' +
        '<' + 'script>' +
        'function initErudaSafe() { if (window.eruda && !window.eruda._isInit) { eruda.init(); } }' +
        'window.addEventListener("load", initErudaSafe);' +
        'initErudaSafe();' +
        '<' + '/script>';

      if (/<\/body>/i.test(userCode)) {
        userCode = userCode.replace(/<\/body>/i, erudaSnippet + '\n</body>');
      } else {
        userCode += erudaSnippet;
      }

      frame.srcdoc = userCode;
    }

    function bersihkan() {
      if (confirm('Hapus isi editor?')) {
        editor.value = '';
        frame.srcdoc = '';
      }
    }

    btnRun.addEventListener('click', jalankanKode);
    btnClear.addEventListener('click', bersihkan);

    window.addEventListener('DOMContentLoaded', jalankanKode);
  </script>

</body>
</html>
