<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uji Coba Eruda DevTools</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #222;
    }
    button {
      background-color: #2563eb;
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
    }
    button.error-btn {
      background-color: #dc2626;
    }
  </style>
</head>
<body>
  <h1>Halaman Uji Coba Eruda</h1>
  <p>Ketuk ikon tombol gerigi kecil di pojok kanan bawah layar HP untuk membuka panel <strong>Eruda DevTools</strong>.</p>
  
  <div>
    <button onclick="console.log('Tes log berhasil pada ' + new Date().toLocaleTimeString())">Kirim Console Log</button>
    <button class="error-btn" onclick="tesError()">Picu Contoh Error</button>
  </div>

  <!-- Memuat Eruda dari CDN -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    // Inisialisasi Eruda
    eruda.init();

    // Fungsi contoh untuk memicu error di tab Console
    function tesError() {
      console.error('Ini adalah contoh pesan error untuk pengujian!');
      variabelTidakTerdefinisi.panggilFungsi();
    }
  </script>
</body>
</html>
