backend:
  name: github
  repo: stejproject/wikis
  branch: main
  base_url: https://sveltia-cms-auth.belajarbroedu.workers.dev
  commit_messages:
    create: 'Buat halaman "{{slug}}"'
    update: 'Sunting halaman "{{slug}}"'
    delete: 'Hapus halaman "{{slug}}"'
    uploadMedia: 'Unggah "{{path}}"'
    deleteMedia: 'Hapus "{{path}}"'

locale: id
site_url: ../
display_url: ../
media_folder: uploads
public_folder: uploads

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: _

collections:
  # Artikel biasa -> content/articles (tombol "Buat halaman baru" mengarah ke sini)
  - name: pages
    label: Artikel
    label_singular: Artikel
    folder: content/articles
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: title
    slug: '{{title}}'
    summary: '{{title}}'
    sortable_fields: [title]
    fields:
      - { name: title, label: Judul, widget: string }
      - { name: categories, label: Kategori, widget: list, required: false, hint: 'Satu kategori per baris' }
      - { name: body, label: Isi, widget: markdown, hint: 'Tautan antar halaman: [[Judul Halaman]] atau [[Judul Halaman|teks tampil]]. Video: klik tombol + lalu pilih Video, atau ketik {{video: alamat-YouTube | keterangan}} pada baris sendiri' }

  # Halaman wiki sendiri (Halaman Utama, Bantuan, Tentang Wiki, dll.) -> content/system
  - name: system
    label: Halaman Sistem
    label_singular: Halaman Sistem
    folder: content/system
    extension: md
    format: frontmatter
    create: true
    delete: false
    identifier_field: title
    slug: '{{title}}'
    summary: '{{title}}'
    sortable_fields: [title]
    fields:
      - { name: title, label: Judul, widget: string }
      - { name: categories, label: Kategori, widget: list, required: false, hint: 'Satu kategori per baris' }
      - { name: body, label: Isi, widget: markdown, hint: 'Tautan antar halaman: [[Judul Halaman]] atau [[Judul Halaman|teks tampil]]. Video: klik tombol + lalu pilih Video, atau ketik {{video: alamat-YouTube | keterangan}} pada baris sendiri' }

  # Daftar video YouTube -> content/data/youtube.json (tampil di stejproject.github.io/posts/youtube/youtube-post.html)
  - name: youtube
    label: Video YouTube
    files:
      - name: daftar
        label: Daftar Video
        file: content/data/youtube.json
        format: json
        fields:
          - label: Video
            label_singular: Video
            name: videos
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Judul, widget: string }
              - { name: channel, label: 'Nama channel', widget: string, required: false }
              - { name: id, label: 'ID video / ID playlist / alamat YouTube', widget: string, hint: 'Contoh: dQw4w9WgXcQ atau tempel alamat video. Beberapa video dalam satu judul: pisahkan dengan spasi.' }
              - { name: note, label: Catatan, widget: text, required: false }
