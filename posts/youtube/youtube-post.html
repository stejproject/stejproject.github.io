<script>
// Daftar video diambil dari content/data/youtube.json (repo wikis), diedit lewat CMS: /wikis/admin/ > Video YouTube
(() => {
  'use strict';
  const DATA = 'https://stejproject.github.io/wikis/content/data/youtube.json';
  const ul = document.getElementById('myUL');
  const VIDEO = /^[\w-]{11}$/, LIST = /^(PL|UU|OL|FL|RD|LL)[\w-]{10,}$/;

  // Terima ID video, ID playlist, atau alamat YouTube lengkap
  function parse(raw) {
    raw = String(raw || '').trim();
    if (VIDEO.test(raw)) return { video: raw };
    if (LIST.test(raw)) return { list: raw };
    try {
      const u = new URL(raw), h = u.hostname.replace(/^(www|m)\./, '');
      let v = '';
      if (h === 'youtu.be') v = u.pathname.split('/')[1] || '';
      else if (h === 'youtube.com' || h === 'youtube-nocookie.com') {
        const m = u.pathname.match(/^\/(?:embed|shorts|live)\/([\w-]{11})/);
        v = m ? m[1] : (u.searchParams.get('v') || '');
      } else return null;
      if (VIDEO.test(v)) return { video: v };
      const l = u.searchParams.get('list') || '';
      if (LIST.test(l)) return { list: l };
    } catch (e) { /* bukan alamat */ }
    return null;
  }

  // Sampul hitam dengan tombol putar; YouTube baru dimuat saat diklik (hemat data)
  function srcdoc(p) {
    const url = p.video
      ? 'https://www.youtube-nocookie.com/embed/' + p.video + '?autoplay=1'
      : 'https://www.youtube-nocookie.com/embed/videoseries?list=' + p.list;
    return "<style> * {padding: 0; margin: 0; overflow: hidden; } body, html {height: 100%;} img, svg {position: absolute;width: 64px;top: 0;bottom: 0;margin: auto; height: 64px;left: 0;right: 0;} svg {filter: drop-shadow(1px 1px 10px hsl(206.5, 70.7%, 8%));transition: all 250ms ease-in-out;}body:hover svg {filter: drop-shadow(1px 1px 10px hsl(206.5, 0%, 10%));transform: scale(1.2);}</style><a href='" + url + "'><svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 24 24' fill='none' stroke='#ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'></circle><polygon points='10 8 16 12 10 16 10 8'></polygon></svg></a>";
  }

  function fill(panel, v) {
    const ps = String(v.id || '').split(/[\s,]+/).filter(Boolean).map(parse).filter(Boolean);
    if (!ps.length) { const n = document.createElement('p'); n.textContent = 'ID video tidak valid.'; panel.appendChild(n); }
    ps.forEach(p => {
      const w0 = document.createElement('div'); w0.className = 'vid-0 w-full';
      const w1 = document.createElement('div'); w1.className = 'vid-1 w-full';
      const f = document.createElement('iframe');
      f.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;';
      f.title = v.title || 'YouTube video player'; f.loading = 'lazy'; f.allowFullscreen = true;
      f.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
      f.srcdoc = srcdoc(p);
      w1.appendChild(f); w0.appendChild(w1); panel.appendChild(w0);
    });
    if (v.note) { const n = document.createElement('p'); n.style.whiteSpace = 'pre-line'; n.textContent = v.note; panel.appendChild(n); }
  }

  function item(v) {
    const li = document.createElement('li'), a = document.createElement('a'), panel = document.createElement('div');
    a.className = 'judpos'; a.tabIndex = 0; a.setAttribute('role', 'button'); a.setAttribute('aria-expanded', 'false');
    a.textContent = (v.title || 'Tanpa judul') + (v.channel ? ' : ' + v.channel : '');
    panel.className = 'panel';
    let built = false;
    const toggle = () => {
      const open = panel.style.display === 'block';
      if (!open && !built) { fill(panel, v); built = true; }
      panel.style.display = open ? 'none' : 'block';
      a.classList.toggle('active', !open);
      a.setAttribute('aria-expanded', String(!open));
    };
    a.addEventListener('click', toggle);
    a.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    li.append(a, panel);
    return li;
  }

  fetch(DATA, { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => (d.videos || []).forEach(v => ul.appendChild(item(v))))
    .catch(() => { const li = document.createElement('li'); li.textContent = 'Daftar video gagal dimuat. Coba muat ulang halaman.'; ul.appendChild(li); });
})();
</script>
