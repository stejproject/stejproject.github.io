backend:
  name: github
  repo: stejproject/stejproject.github.io
  branch: main
  commit_messages:
    create: 'Buat halaman "{{slug}}"'
    update: 'Sunting halaman "{{slug}}"'
    delete: 'Hapus halaman "{{slug}}"'
    uploadMedia: 'Unggah "{{path}}"'
    deleteMedia: 'Hapus "{{path}}"'

locale: id
site_url: ../
display_url: ../
# Path di dalam repo (wiki ada di posts/category/wiki/)
media_folder: posts/category/wiki/uploads
# Path di tulisan artikel; relatif terhadap halaman wiki
public_folder: uploads

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: _

collections:
  # Artikel biasa (tombol "Buat halaman baru" mengarah ke sini)
  - name: pages
    label: Artikel
    label_singular: Artikel
    folder: posts/category/wiki/content/articles
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: title
    slug: '{{title}}'
    summary: '{{title}}'
    sortable_fields: [title]
    fields:
      - { name: title, label: Judul, widget: string }
      - { name: categories, label: Kategori, widget: list, required: false, hint: 'Satu kategori per baris' }
      - { name: body, label: Isi, widget: markdown, hint: 'Tautan antar halaman: [[Judul Halaman]] atau [[Judul Halaman|teks tampil]]' }

  # Halaman wiki sendiri (Halaman Utama, Bantuan, Tentang Wiki, dll.)
  - name: system
    label: Halaman Sistem
    label_singular: Halaman Sistem
    folder: posts/category/wiki/content/system
    extension: md
    format: frontmatter
    create: true
    delete: false
    identifier_field: title
    slug: '{{title}}'
    summary: '{{title}}'
    sortable_fields: [title]
    fields:
      - { name: title, label: Judul, widget: string }
      - { name: categories, label: Kategori, widget: list, required: false, hint: 'Satu kategori per baris' }
      - { name: body, label: Isi, widget: markdown, hint: 'Tautan antar halaman: [[Judul Halaman]] atau [[Judul Halaman|teks tampil]]' }
