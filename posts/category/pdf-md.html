<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF ke Markdown</title>
    <!-- Muat PDF.js dari CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border-color: #cbd5e1;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 { margin-top: 0; font-size: 1.5rem; }
        .upload-box {
            border: 2px dashed var(--border-color);
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .upload-box:hover { border-color: var(--primary); }
        input[type="file"] { display: none; }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            display: none;
            margin-top: 15px;
        }
        button:hover { background-color: var(--primary-hover); }
        textarea {
            width: 100%;
            height: 300px;
            margin-top: 20px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            resize: vertical;
            box-sizing: border-box;
        }
        #status { font-size: 0.9rem; color: #64748b; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Konverter PDF ke Markdown + Gambar</h1>
    <p>Pilih file PDF untuk mengekstrak teks dan gambar ke dalam format Markdown secara instan.</p>

    <div class="upload-box" onclick="document.getElementById('pdfFile').click()">
        <p id="file-label">Klik di sini atau seret file PDF ke sini</p>
        <input type="file" id="pdfFile" accept=".pdf">
    </div>

    <div id="status"></div>
    
    <textarea id="output" placeholder="Hasil Markdown akan muncul di sini..."></textarea>
    <br>
    <button id="downloadBtn" onclick="downloadMarkdown()">Unduh File .md</button>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const fileInput = document.getElementById('pdfFile');
    const fileLabel = document.getElementById('file-label');
    const outputArea = document.getElementById('output');
    const statusDiv = document.getElementById('status');
    const downloadBtn = document.getElementById('downloadBtn');
    
    let markdownContent = '';
    let fileName = 'converted.md';

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        fileName = file.name.replace(/\.[^/.]+$/, "") + ".md";
        fileLabel.textContent = `File dipilih: ${file.name}`;
        statusDiv.textContent = 'Membaca dan memproses PDF beserta gambar...';
        outputArea.value = '';
        downloadBtn.style.display = 'none';

        try {
            const arrayBuffer = await file.arrayBuffer();
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdfDoc = await loadingTask.promise;
            
            let fullText = '';

            for (let i = 1; i <= pdfDoc.numPages; i++) {
                statusDiv.textContent = `Memproses halaman ${i} dari ${pdfDoc.numPages}...`;
                const page = await pdfDoc.getPage(i);
                
                // 1. Ambil Teks Halaman
                const textContent = await page.getTextContent();
                let pageText = textContent.items.map(item => item.str).join(' ');

                fullText += `## Halaman ${i}\n\n${pageText}\n\n`;

                // 2. Ambil Operator Halaman untuk Mendeteksi Gambar (XObject / Images)
                const operatorList = await page.getOperatorList();
                let imageCount = 0;

                for (let j = 0; j < operatorList.fnArray.length; j++) {
                    // 58 adalah kode operator PDF.js untuk menggambar objek gambar (PAINT_IMAGE_XOBJECT / dll)
                    if (operatorList.fnArray[j] === pdfjsLib.OPS.paintImageXObject || 
                        operatorList.fnArray[j] === pdfjsLib.OPS.paintInlineImageXObject) {
                        
                        const imageName = operatorList.argsArray[j][0];
                        try {
                            const imgData = await new Promise((resolve) => {
                                page.objs.get(imageName, (img) => {
                                    resolve(img);
                                });
                            });

                            if (imgData && imgData.width && imgData.height) {
                                imageCount++;
                                const base64Img = canvasImgToBase64(imgData);
                                if (base64Img) {
                                    fullText += `![Gambar ${i}.${imageCount}](${base64Img})\n\n`;
                                }
                            }
                        } catch (imgErr) {
                            console.warn(`Gagal mengekstrak gambar di halaman ${i}:`, imgErr);
                        }
                    }
                }

                fullText += `---\n\n`;
            }

            markdownContent = fullText;
            outputArea.value = markdownContent;
            statusDiv.textContent = 'Konversi selesai!';
            downloadBtn.style.display = 'inline-block';
        } catch (error) {
            console.error(error);
            statusDiv.textContent = 'Terjadi kesalahan saat memproses file PDF.';
        }
    });

    // Fungsi bantu untuk mengubah data objek gambar PDF.js menjadi Base64 PNG menggunakan canvas sementara
    function canvasImgToBase64(imgData) {
        const canvas = document.createElement('canvas');
        canvas.width = imgData.width;
        canvas.height = imgData.height;
        const ctx = canvas.getContext('2d');
        
        let data = imgData.data;
        // Tangani format warna gambar PDF yang bervariasi
        if (imgData.kind === pdfjsLib.ImageKind.RGBA_32BPP) {
            const arr = new Uint8ClampedArray(data.buffer);
            const imgObj = new ImageData(arr, imgData.width, imgData.height);
            ctx.putImageData(imgObj, 0, 0);
        } else {
            // Konversi manual untuk format grayscale atau RGB standar
            const arr = new Uint8ClampedArray(imgData.width * imgData.height * 4);
            let p = 0, q = 0;
            for (let i = 0; i < imgData.width * imgData.height; i++) {
                arr[p] = data[q];       // R
                arr[p + 1] = data[q+1]; // G
                arr[p + 2] = data[q+2]; // B
                arr[p + 3] = 255;       // A (Alpha)
                p += 4;
                q += 3;
            }
            const imgObj = new ImageData(arr, imgData.width, imgData.height);
            ctx.putImageData(imgObj, 0, 0);
        }
        
        return canvas.toDataURL('image/png');
    }

    function downloadMarkdown() {
        const blob = new Blob([markdownContent], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
