<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanya Wiki</title>
<style>
  :root {
    --bg: #ffffff; --side: #f6f8fc; --ink: #1f1f1f; --muted: #5f6368; --line: #dadce0;
    --card: #ffffff; --chip: #eef1f8; --accent: #1a56c4; --accent-bg: #e8f0fe; --mark: #fff1a8;
    --shadow: 0 1px 6px rgba(32,33,36,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131314; --side: #1b1c1f; --ink: #e8eaed; --muted: #9aa0a6; --line: #3c4043;
      --card: #1e1f22; --chip: #2a2c31; --accent: #8ab4f8; --accent-bg: #263451; --mark: #5c4d00;
      --shadow: 0 1px 6px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #131314; --side: #1b1c1f; --ink: #e8eaed; --muted: #9aa0a6; --line: #3c4043;
    --card: #1e1f22; --chip: #2a2c31; --accent: #8ab4f8; --accent-bg: #263451; --mark: #5c4d00;
    --shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .side { width: 64px; background: var(--side); display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 8px; flex: none; }
  .side .sp { flex: 1; }
  .icon-btn { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  .icon-btn:hover { background: var(--chip); color: var(--ink); }
  .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
  .top { display: flex; align-items: center; gap: 24px; padding: 16px 32px; font-size: 14px; }
  .top .brand { font-weight: 600; color: var(--ink); }
  .top a { color: var(--muted); }
  .top .grow { flex: 1; }

  .stage { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 0 16px; }
  .col { width: 100%; max-width: 750px; }

  .hello { margin: 12vh 0 28px; text-align: center; font-size: clamp(24px, 4vw, 32px); font-weight: 400; }
  body.chatting .hello, body.chatting .suggest, body.chatting #form { display: none; }

  .box { background: var(--card); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); padding: 14px 16px 10px 20px; }
  .box:focus-within { box-shadow: 0 2px 10px rgba(32,33,36,.28); }
  .box textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; color: inherit; font: inherit; max-height: 160px; padding: 4px 0; }
  .box .row { display: flex; justify-content: flex-end; align-items: center; min-height: 36px; }
  .send { width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; }
  .send[disabled] { background: var(--chip); color: var(--muted); cursor: default; }
  .send svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .suggest { list-style: none; margin: 20px 0 0; padding: 0; }
  .suggest button { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 0; background: transparent; color: var(--muted); font: inherit; padding: 10px 14px; border-radius: 12px; cursor: pointer; }
  .suggest button:hover { background: var(--chip); color: var(--ink); }
  .suggest svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .msgs { padding: 8px 0 24px; }
  .q { margin: 20px 0 8px auto; width: fit-content; max-width: 85%; background: var(--chip); padding: 10px 16px; border-radius: 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .a { margin: 8px 0 24px; }
  .a .lead { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .hit { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 0 0 12px; background: var(--card); }
  .hit p { margin: 0 0 8px; overflow-wrap: anywhere; }
  .hit mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
  .src { display: inline-block; font-size: 13px; background: var(--accent-bg); border-radius: 999px; padding: 3px 12px; }
  .none { margin: 0; }
  .say { margin: 0 0 12px; }
  .note { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .chips .lbl { width: 100%; font-size: 13px; color: var(--muted); }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--accent); font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 999px; cursor: pointer; text-align: left; }
  .chip:hover { background: var(--accent-bg); }
  .gen { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  details.srcs { margin: 0 0 12px; }
  details.srcs summary { cursor: pointer; color: var(--muted); font-size: 14px; margin: 0 0 8px; }

  .aibar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 32px 6px; font-size: 13px; }
  .aibar[hidden] { display: none; }
  .aibtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font: inherit; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
  .aibtn:hover { background: var(--chip); color: var(--ink); }
  .aibtn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .aibtn[data-state="on"] .dot { background: #1e8e3e; }
  .aibtn[data-state="load"] .dot { background: #f9ab00; }
  .aibtn[data-state="err"] .dot { background: #d93025; }
  .aibtn .st { color: var(--ink); }
  .ainote { color: var(--muted); }

  .dock { padding: 8px 16px 16px; display: flex; justify-content: center; }
  body:not(.chatting) .dock { display: none; }
  .dock .col { max-width: 750px; }
  .foot { text-align: center; font-size: 12px; color: var(--muted); margin: 8px 0 0; }

  /* Mode popup (dipanggil dari index.html lewat ?embed=1) */
  body.embed .side, body.embed .top { display: none; }
  body.embed .hello { margin: 6vh 0 20px; font-size: 22px; }
  body.embed .stage { padding: 12px 12px 0; }
  body.embed .dock { padding: 8px 12px 12px; }
  body.embed .foot { font-size: 11px; }

  @media (max-width: 640px) {
    .side { display: none; }
    .top { padding: 12px 16px; gap: 16px; }
    .aibar { padding: 0 16px 6px; }
    .hello { margin-top: 8vh; }
  }
</style>
</head>
<body>
<nav class="side" aria-label="Menu">
  <button class="icon-btn" id="newChat" title="Percakapan baru" aria-label="Percakapan baru">
    <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  </button>
  <a class="icon-btn" id="homeLink" href="/" title="Kembali ke wiki" aria-label="Kembali ke wiki">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5Z"/><path d="M6.5 17H20v4H6.5A2.5 2.5 0 0 1 4 18.5"/></svg>
  </a>
  <div class="sp"></div>
  <button class="icon-btn" id="theme" title="Ganti tema" aria-label="Ganti tema">
    <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
  </button>
</nav>

<div class="main">
  <header class="top">
    <span class="brand" id="brand">Tanya Wiki</span>
    <a href="/">Wiki</a>
    <a href="/#/Khusus:Semua_halaman">Semua halaman</a>
    <span class="grow"></span>
    <span id="status" style="color:var(--muted)">Memuat artikel…</span>
  </header>

  <div class="aibar" id="aibar" hidden>
    <button class="aibtn" id="btnEmb" type="button" data-state="off" title="Mencocokkan makna kalimat, bukan hanya kata. Unduhan pertama kali, lalu tersimpan di browser."><span class="dot"></span>Pencarian makna <span class="st">Aktifkan</span></button>
    <button class="aibtn" id="btnGen" type="button" data-state="off" title="Model bahasa yang berjalan di browser Anda. Unduhan besar pertama kali, lalu tersimpan di browser."><span class="dot"></span>Mode obrolan <span class="st">Aktifkan</span></button>
    <span class="ainote" id="ainote"></span>
  </div>

  <div class="stage" id="stage">
    <div class="col">
      <h1 class="hello">Halo, apa yang ingin Anda ketahui?</h1>
      <form class="box" id="form" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Tanyakan apa saja tentang isi wiki" aria-label="Pertanyaan"></textarea>
        <div class="row">
          <button class="send" id="send" type="submit" disabled aria-label="Kirim">
            <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
          </button>
        </div>
      </form>
      <ul class="suggest" id="suggest"></ul>
      <div class="msgs" id="msgs" aria-live="polite"></div>
    </div>
  </div>

  <div class="dock" id="dock">
    <div class="col">
      <form class="box" id="form2" autocomplete="off">
        <textarea id="input2" rows="1" placeholder="Tanyakan hal lain" aria-label="Pertanyaan lanjutan"></textarea>
        <div class="row">
          <button class="send" id="send2" type="submit" disabled aria-label="Kirim">
            <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
          </button>
        </div>
      </form>
      <p class="foot" id="foot">Jawaban dikutip langsung dari artikel wiki dan diproses di browser Anda, tanpa layanan AI eksternal. Periksa artikel sumbernya.</p>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  let cfg = { title: 'Wiki', contentBase: '/wikis/' };
  let pages = [], chunks = [], df = new Map(), avgLen = 1, ready = false;

  // ---------- Teks & pencarian (semua di browser) ----------
  const STOP = new Set(('yang dan di ke dari untuk pada dengan adalah itu ini atau juga akan dapat bisa ada tidak ' +
    'sebagai oleh dalam karena agar saat sudah telah lebih para sebuah suatu apa siapa kapan dimana mana bagaimana ' +
    'kenapa mengapa berapa apakah jelaskan jelasin tolong saya aku kita kami anda dia mereka sih dong nih tuh ' +
    'cara tentang soal mengenai artinya arti maksud pengertian definisi').split(' '));
  const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const stem = w => {
    if (w.length <= 4) return w;
    w = w.replace(/(nya|lah|kah|pun)$/, '');
    w = w.replace(/^(meng|meny|mem|men|me|peng|peny|pem|pen|pe|ber|ter|di|ke|se)(?=.{4,})/, '');
    w = w.replace(/(kan|an|i)$/, '');
    return w;
  };
  const tokens = s => (norm(s).match(/[a-z0-9]+/g) || []).filter(w => !STOP.has(w)).map(stem).filter(w => w.length > 1);

  // Sinonim bawaan. Tambahkan sendiri lewat "synonyms" di config.json, mis. [["motor","sepeda motor"],["harga","biaya"]]
  const DEFAULT_SYN = [
    ['pembuat', 'pendiri', 'pencipta', 'penemu'],
    ['lahir', 'kelahiran'],
    ['meninggal', 'wafat', 'mati'],
    ['sejarah', 'asal', 'riwayat'],
    ['fungsi', 'kegunaan', 'manfaat', 'guna'],
    ['masalah', 'kendala', 'kesulitan', 'problem'],
    ['pakai', 'gunakan', 'menggunakan'],
    ['buat', 'bikin', 'membuat'],
    ['hapus', 'buang', 'delete'],
    ['ubah', 'ganti', 'edit'],
    ['tampil', 'lihat', 'tampilkan'],
    ['orang', 'tokoh', 'sosok'],
    ['makanan', 'kuliner', 'hidangan'],
    ['gambar', 'foto', 'citra'],
    ['kode', 'program', 'skrip', 'script'],
    ['pasang', 'instal', 'install'],
    ['unduh', 'download'],
    ['harga', 'biaya', 'tarif'],
    ['besar', 'luas', 'ukuran'],
    ['kota', 'ibukota'],
    ['negara', 'negeri'],
    ['bangun', 'dirikan', 'bangunan'],
    ['wiki', 'ensiklopedia']
  ];
  let vocab = new Set(), syn = new Map(), pageChunks = new Map(), last = null;

  function buildSyn(groups) {
    syn = new Map();
    for (const g of groups) {
      if (!Array.isArray(g)) continue;
      const ts = [...new Set(g.map(w => tokens(w)).filter(a => a.length === 1).map(a => a[0]))];
      for (const a of ts) {
        if (!syn.has(a)) syn.set(a, new Set());
        for (const b of ts) if (a !== b) syn.get(a).add(b);
      }
    }
  }

  function lev(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i]; let min = i;
      for (let j = 1; j <= b.length; j++) {
        const v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        cur[j] = v; if (v < min) min = v;
      }
      if (min > max) return max + 1;
      prev = cur;
    }
    return prev[b.length];
  }

  function buildIndex() {
    chunks = []; pageChunks = new Map();
    for (const p of pages) {
      if (p.system) continue;
      const sents = String(p.text || '').split(/(?<=[.!?])\s+/).filter(Boolean);
      let cur = '', pc = 0;
      const flush = () => {
        if (cur.trim()) {
          const c = { p, text: cur.trim(), pos: pc++ };
          chunks.push(c);
          if (!pageChunks.has(p.slug)) pageChunks.set(p.slug, []);
          pageChunks.get(p.slug).push(c);
        }
        cur = '';
      };
      for (const s of sents) {
        if (cur && (cur + ' ' + s).length > 320) flush();
        cur += (cur ? ' ' : '') + s;
      }
      flush();
    }
    let total = 0;
    for (const c of chunks) {
      c.tok = tokens(c.text);
      c.tf = new Map();
      for (const t of c.tok) c.tf.set(t, (c.tf.get(t) || 0) + 1);
      c.title = new Set(tokens(c.p.title + ' ' + (c.p.categories || []).join(' ')));
      c.ttl = new Set(tokens(c.p.title));
      total += c.tok.length;
      for (const t of c.tf.keys()) df.set(t, (df.get(t) || 0) + 1);
    }
    avgLen = chunks.length ? total / chunks.length : 1;
    chunks.forEach((c, i) => { c.i = i; });
    vocab = new Set(df.keys());
    for (const c of chunks) for (const t of c.title) vocab.add(t);
  }

  // Kata pengganti untuk satu kata pertanyaan: sinonim, awalan, dan perkiraan salah ketik
  function alts(t) {
    const out = new Map();
    for (const s of syn.get(t) || []) if (vocab.has(s)) out.set(s, 0.6);
    if (!vocab.has(t) && t.length >= 4) {
      const max = t.length >= 8 ? 2 : 1, cand = [];
      for (const v of vocab) {
        if (v.startsWith(t)) cand.push([v, 0.65]);
        else { const d = lev(t, v, max); if (d <= max) cand.push([v, d === 1 ? 0.75 : 0.6]); }
      }
      cand.sort((a, b) => b[1] - a[1]);
      for (const [v, w] of cand.slice(0, 4)) if (!out.has(v)) out.set(v, w);
    }
    return [...out].map(([term, w]) => ({ term, w }));
  }

  function search(q, boostSlug) {
    const qt = [...new Set(tokens(q))];
    if (!qt.length) return { qt, groups: [], terms: new Set(), hits: [], related: [], ranked: [], loose: false };
    const groups = qt.map(t => [{ term: t, w: 1 }, ...alts(t)]);
    const terms = new Set(groups.flat().map(x => x.term));
    const nq = norm(q);
    const wantYear = /\bkapan\b|\btahun berapa\b/.test(nq), wantNum = /\bberapa\b/.test(nq);
    const N = chunks.length, k1 = 1.4, b = 0.75;
    const scored = [];
    for (const c of chunks) {
      let s = 0, matched = 0;
      for (const g of groups) {
        let best = 0;
        for (const { term, w } of g) {
          const f = c.tf.get(term) || 0, inTitle = c.title.has(term);
          if (!f && !inTitle) continue;
          const n = df.get(term) || 0, idf = Math.log(1 + (N - n + 0.5) / (n + 0.5));
          let v = idf * ((f * (k1 + 1)) / (f + k1 * (1 - b + b * c.tok.length / avgLen)));
          if (inTitle) v += 1.5;
          v *= w;
          if (v > best) best = v;
        }
        if (best > 0) { matched++; s += best; }
      }
      if (!matched) continue;
      const cov = matched / groups.length;
      if (groups.length >= 3 && cov < 0.34) continue;
      s *= 0.4 + 0.6 * cov;
      // Pertanyaan yang hampir sama dengan judul artikel: utamakan artikel itu, mulai dari bagian awalnya
      const inTtl = groups.filter(g => g.some(x => c.ttl.has(x.term))).length;
      if (inTtl === groups.length) s += 8; else if (inTtl / groups.length >= 0.6) s += 3;
      if (inTtl && c.pos < 2) s += 1.5 - 0.5 * c.pos;
      if (boostSlug && c.p.slug === boostSlug) s += 3;
      if (wantYear && /\b(1[0-9]{3}|20[0-9]{2})\b/.test(c.text)) s += 1;
      if (wantNum && /\d/.test(c.text)) s += 0.8;
      scored.push({ c, s, cov });
    }
    scored.sort((a, b) => b.s - a.s);
    const hits = [], perPage = new Map(), related = [];
    const top = scored.length ? scored[0].s : 0;
    for (const x of scored) {
      if (x.s < 0.8 || x.s < top * 0.35) break; // buang hasil yang jauh di bawah yang terbaik
      const n = perPage.get(x.c.p.slug) || 0;
      if (n >= 2) continue;
      perPage.set(x.c.p.slug, n + 1);
      hits.push(x);
      if (hits.length >= 3) break;
    }
    const ranked = scored.filter(x => x.s >= 0.8 && x.s >= top * 0.35);
    const seen = new Set(hits.map(h => h.c.p.slug));
    for (const x of scored) {
      if (related.length >= 3) break;
      if (x.s < 0.8 || seen.has(x.c.p.slug)) continue;
      seen.add(x.c.p.slug); related.push(x.c.p);
    }
    const loose = groups.some(g => !vocab.has(g[0].term) && g.length > 1) || (hits.length > 0 && hits[0].cov < 1);
    return { qt, groups, terms, hits, related, ranked, loose };
  }

  // ---------- AI lokal (opsional): pencarian makna + model bahasa ----------
  // Semua file (pustaka, WASM, model) dilayani dari server wiki sendiri; lihat setup-ai.mjs.
  const AI_DEF = {
    lib: '/vendor/transformers/transformers.min.js',
    wasmDir: '/vendor/transformers/',
    modelsPath: '/models/',
    embed: 'Xenova/multilingual-e5-small', embedDtype: 'q8', minSim: 0.8,
    llm: 'onnx-community/Qwen2.5-0.5B-Instruct', llmDtype: 'q4', maxTokens: 300,
    autoEmbed: false
  };
  const AI = { a: AI_DEF, lib: null, emb: null, vecs: null, dim: 0, useEmb: false, loadingEmb: false, gen: null, useGen: false, loadingGen: false };
  let busy = false, history = [];
  const SYSTEM = 'Kamu asisten untuk sebuah wiki. Jawab dalam bahasa Indonesia, singkat dan jelas (maksimal 4 kalimat). ' +
    'Jawab hanya berdasarkan KONTEKS yang diberikan dan jangan mengarang. Jika KONTEKS tidak memuat jawabannya, katakan bahwa informasi itu tidak ada di wiki. ' +
    'Jika pengguna hanya menyapa atau mengobrol ringan, balas dengan ramah dan singkat.';

  const idb = (mode, fn) => new Promise((res, rej) => {
    const r = indexedDB.open('tanya-wiki', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onerror = () => rej(r.error);
    r.onsuccess = () => {
      const tx = r.result.transaction('kv', mode), req = fn(tx.objectStore('kv'));
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = () => rej(tx.error);
    };
  });
  const idbGet = k => idb('readonly', s => s.get(k)).catch(() => null);
  const idbSet = (k, v) => idb('readwrite', s => s.put(v, k)).catch(() => {});
  function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }

  async function loadLib() {
    if (AI.lib) return AI.lib;
    const a = AI.a, abs = p => new URL(p, location.href).href;
    const lib = window.tanyaAiLib || await import(abs(a.lib)); // window.tanyaAiLib: titik sambung untuk pengujian
    const env = lib.env;
    env.allowRemoteModels = false; // tidak ada unduhan dari luar server ini
    env.allowLocalModels = true;
    env.localModelPath = String(a.modelsPath).replace(/\/*$/, '/');
    const safari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
    const f = safari ? 'ort-wasm-simd-threaded' : 'ort-wasm-simd-threaded.asyncify';
    const wasm = env.backends && env.backends.onnx && env.backends.onnx.wasm;
    if (wasm) wasm.wasmPaths = { mjs: abs(a.wasmDir + f + '.mjs'), wasm: abs(a.wasmDir + f + '.wasm') };
    AI.lib = lib;
    return lib;
  }

  function setBtn(which, state, text) {
    const b = $(which === 'emb' ? 'btnEmb' : 'btnGen');
    b.dataset.state = state;
    b.querySelector('.st').textContent = text || '';
  }
  const progressTo = (which, label) => {
    const files = new Map();
    return p => {
      if (!p || p.status !== 'progress' || !p.total) return;
      files.set(p.file, [p.loaded, p.total]);
      let l = 0, t = 0;
      for (const v of files.values()) { l += v[0]; t += v[1]; }
      setBtn(which, 'load', label + ' ' + Math.round(100 * l / t) + '%');
    };
  };
  function aiError(which, e) {
    console.error(e);
    setBtn(which, 'err', 'Gagal');
    $('ainote').textContent = 'Gagal memuat ' + (which === 'emb' ? 'pencarian makna' : 'model obrolan') + ': ' +
      String(e && e.message || e).slice(0, 140) + ' (periksa file di ' + AI.a.modelsPath + ' dan /vendor/, lihat setup-ai.mjs)';
  }
  function refreshAi() {
    const upd = (which, loaded, use, loading) => {
      const b = $(which === 'emb' ? 'btnEmb' : 'btnGen');
      if (loading || b.dataset.state === 'err' && !loaded) return;
      setBtn(which, loaded && use ? 'on' : 'off', loaded ? (use ? 'Aktif' : 'Dimatikan') : 'Aktifkan');
    };
    upd('emb', !!AI.emb, AI.useEmb, AI.loadingEmb);
    upd('gen', !!AI.gen, AI.useGen, AI.loadingGen);
    $('foot').textContent = AI.useGen
      ? 'Mode obrolan memakai model bahasa yang berjalan di browser Anda, tanpa layanan eksternal. Jawabannya bisa keliru; periksa artikel sumbernya.'
      : 'Jawaban dikutip langsung dari artikel wiki dan diproses di browser Anda, tanpa layanan AI eksternal. Periksa artikel sumbernya.';
  }
  function saveAi() { try { localStorage.setItem('tanya-ai', JSON.stringify({ emb: AI.useEmb, gen: AI.useGen })); } catch (e) {} }

  async function enableEmb() {
    if (AI.loadingEmb) return;
    if (AI.emb) { AI.useEmb = !AI.useEmb; saveAi(); refreshAi(); return; }
    AI.loadingEmb = true; $('ainote').textContent = '';
    try {
      setBtn('emb', 'load', 'Memuat 0%');
      const lib = await loadLib(), a = AI.a;
      const ext = await lib.pipeline('feature-extraction', a.embed, { dtype: a.embedDtype, progress_callback: progressTo('emb', 'Memuat') });
      const texts = chunks.map(c => 'passage: ' + c.p.title + '. ' + c.text);
      const key = 'emb:' + a.embed + ':' + a.embedDtype + ':' + hashStr(texts.join('\n'));
      const cached = await idbGet(key);
      if (cached && cached.buf && cached.n === texts.length) {
        AI.vecs = new Float32Array(cached.buf); AI.dim = cached.dim;
      } else {
        let vecs = null, dim = 0;
        for (let i = 0; i < texts.length; i += 8) {
          const out = await ext(texts.slice(i, i + 8), { pooling: 'mean', normalize: true });
          if (!vecs) { dim = out.dims[1]; vecs = new Float32Array(texts.length * dim); }
          vecs.set(out.data, i * dim);
          setBtn('emb', 'load', 'Mengindeks ' + Math.round(100 * Math.min(i + 8, texts.length) / texts.length) + '%');
        }
        AI.vecs = vecs; AI.dim = dim;
        if (vecs) await idbSet(key, { buf: vecs.buffer, dim, n: texts.length });
      }
      AI.emb = ext; AI.useEmb = true;
    } catch (e) { aiError('emb', e); }
    AI.loadingEmb = false;
    saveAi(); refreshAi();
  }

  async function enableGen() {
    if (AI.loadingGen) return;
    if (AI.gen) { AI.useGen = !AI.useGen; saveAi(); refreshAi(); return; }
    AI.loadingGen = true; $('ainote').textContent = '';
    try {
      setBtn('gen', 'load', 'Memuat 0%');
      const lib = await loadLib(), a = AI.a;
      const mk = device => lib.pipeline('text-generation', a.llm, { dtype: a.llmDtype, device, progress_callback: progressTo('gen', 'Memuat') });
      try { AI.gen = await mk(navigator.gpu ? 'webgpu' : 'wasm'); }
      catch (e) { if (!navigator.gpu) throw e; console.warn('WebGPU gagal, memakai WASM', e); AI.gen = await mk('wasm'); }
      AI.useGen = true;
    } catch (e) { aiError('gen', e); }
    AI.loadingGen = false;
    saveAi(); refreshAi();
  }

  function aiSetup() {
    if (cfg.ai === false) { $('aibar').hidden = true; return; }
    AI.a = { ...AI_DEF, ...(cfg.ai || {}) };
    $('aibar').hidden = false;
    $('btnEmb').addEventListener('click', enableEmb);
    $('btnGen').addEventListener('click', enableGen);
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem('tanya-ai') || '{}'); } catch (e) {}
    refreshAi();
    (async () => { // pilihan yang dulu diaktifkan dimuat otomatis (file sudah ada di cache browser)
      if (saved.emb || AI.a.autoEmbed) await enableEmb();
      if (saved.gen) await enableGen();
    })();
  }

  // Gabungkan peringkat kata kunci (BM25) dengan kemiripan makna (embedding) lewat reciprocal rank fusion
  async function hybrid(q, r, boostSlug) {
    if (!AI.useEmb || !AI.emb || !AI.vecs || !chunks.length) return r;
    const qo = await AI.emb('query: ' + (boostSlug && last ? last.title + '. ' + q : q), { pooling: 'mean', normalize: true });
    const qv = qo.data, d = AI.dim, v = AI.vecs, n = chunks.length, sims = new Float32Array(n);
    for (let i = 0; i < n; i++) { let x = 0; const o = i * d; for (let j = 0; j < d; j++) x += v[o + j] * qv[j]; sims[i] = x; }
    const idx = Array.from(sims.keys()).sort((x, y) => sims[y] - sims[x]).slice(0, 12);
    const topSim = sims[idx[0]], minSim = AI.a.minSim, K = 60, map = new Map();
    const add = (c, w, cov) => { const e = map.get(c) || { c, s: 0, cov: 0, sim: sims[c.i] }; e.s += w; if (cov != null) e.cov = cov; map.set(c, e); };
    r.ranked.slice(0, 15).forEach((x, i) => add(x.c, 1 / (K + i), x.cov));
    idx.forEach((i, rank) => { if (sims[i] >= minSim && sims[i] >= topSim - 0.05) add(chunks[i], 1 / (K + rank)); });
    if (boostSlug) for (const e of map.values()) if (e.c.p.slug === boostSlug) e.s += 0.008;
    const list = [...map.values()].sort((x, y) => y.s - x.s);
    const hits = [], per = new Map(), limit = AI.useGen ? 4 : 3;
    for (const e of list) {
      const k = per.get(e.c.p.slug) || 0;
      if (k >= 2) continue;
      per.set(e.c.p.slug, k + 1); hits.push(e);
      if (hits.length >= limit) break;
    }
    const seen = new Set(hits.map(h => h.c.p.slug)), related = [];
    for (const e of list) { if (related.length >= 3) break; if (!seen.has(e.c.p.slug)) { seen.add(e.c.p.slug); related.push(e.c.p); } }
    return { ...r, hits, related, sem: true, loose: hits.length > 0 && !(hits[0].cov >= 1) };
  }

  async function generate(q, hits, onText) {
    const ctx = hits.length ? hits.map((h, i) => '[' + (i + 1) + '] ' + h.c.p.title + ': ' + h.c.text).join('\n') : '(tidak ada kutipan wiki yang relevan)';
    const messages = [{ role: 'system', content: SYSTEM }];
    for (const t of history.slice(-2)) messages.push({ role: 'user', content: t.q }, { role: 'assistant', content: t.a.slice(0, 400) });
    messages.push({ role: 'user', content: 'KONTEKS:\n' + ctx + '\n\nPERTANYAAN: ' + q });
    let acc = '';
    const streamer = new AI.lib.TextStreamer(AI.gen.tokenizer, {
      skip_prompt: true, skip_special_tokens: true, callback_function: t => { acc += t; onText(acc); }
    });
    const out = await AI.gen(messages, { max_new_tokens: AI.a.maxTokens, do_sample: false, repetition_penalty: 1.1, streamer });
    const msg = out && out[0] && out[0].generated_text;
    const text = Array.isArray(msg) ? (msg[msg.length - 1].content || acc) : (acc || String(msg || ''));
    return text.trim();
  }

  // ---------- Percakapan ----------
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const articles = () => pages.filter(p => !p.system && p.categories !== undefined);
  const titleChips = ps => ps.map(p => ({ label: p.title, q: p.title }));
  const someTopics = () => titleChips(articles().slice().sort(() => Math.random() - 0.5).slice(0, 3));

  function more() {
    const rest = (pageChunks.get(last.slug) || []).filter(c => !last.shown.has(c.pos));
    const list = rest.slice(0, 2);
    if (!list.length) {
      return { say: ['Sudah sampai akhir artikel “' + last.title + '”.'], chipLabel: 'Topik lain:', chips: someTopics() };
    }
    for (const c of list) last.shown.add(c.pos);
    return {
      say: ['Lanjutan dari “' + last.title + '”:'], hits: list.map(c => ({ c })), terms: last.terms,
      chips: rest.length > list.length ? [{ label: 'Lanjutkan lagi', q: 'lanjut' }] : []
    };
  }

  function noAnswer(r) {
    const tt = pages.filter(p => !p.system).map(p => {
      const ws = tokens(p.title);
      let s = 0;
      for (const g of r.groups) if (g.some(x => ws.some(w => w === x.term || (w.length >= 4 && x.term.length >= 4 && lev(w, x.term, 1) <= 1)))) s++;
      return { p, s };
    }).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 3).map(x => x.p);
    return {
      say: ['Saya belum menemukan jawabannya di artikel wiki.'],
      chipLabel: tt.length ? 'Mungkin maksud Anda:' : 'Coba salah satu topik ini:',
      chips: tt.length ? titleChips(tt) : someTopics(), allLink: true
    };
  }

  async function respond(raw) {
    const nq = norm(raw).replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
    if (last && /^(lanjut\w*|terus\w*|lagi|lebih (detail|lengkap|rinci)|selengkapnya|berikutnya|next|jelaskan lebih lanjut|ceritakan lebih (banyak|lanjut))$/.test(nq)) return more();

    const bare = nq.replace(/^(halo+|hai+|hi+|hello|hey|hei|selamat (pagi|siang|sore|malam)|permisi|assalamualaikum|salam)\b\s*/, '');
    if (nq && !bare) return { say: [pick(['Halo! Mau tahu tentang apa dari wiki ini?', 'Hai! Silakan tanya apa saja soal isi wiki.'])], chips: someTopics(), chipLabel: 'Atau coba:' };
    if (/^(apa kabar|gimana kabar\w*|bagaimana kabar\w*|how are you)/.test(bare)) return { say: ['Baik, terima kasih. Ada yang ingin dicari di wiki?'] };
    if (bare.split(' ').length <= 4 && /^(terima ?kasih|makasih|thanks|thank you|thx|tengkyu|oke|ok|sip|mantap|siap)\b/.test(bare)) return { say: [pick(['Sama-sama!', 'Siap, silakan tanya lagi kapan saja.'])] };
    if (/^(sampai jumpa|dadah|bye|dah ya|udah cukup|sudah cukup)\b/.test(bare)) return { say: ['Sampai jumpa!'] };
    if (/^(kamu|anda|kau|km|lu) (itu )?(siapa|apa)\b|^siapa (kamu|anda|kau)\b/.test(bare)) {
      return { say: [AI.useGen && AI.gen
        ? 'Saya asisten untuk wiki ini, ditenagai model bahasa kecil yang berjalan di browser Anda dan menjawab dari kutipan artikel. Jawaban saya bisa keliru, jadi periksa sumbernya.'
        : 'Saya asisten pencari untuk wiki ini. Saya bukan AI generatif: saya mencari lalu mengutip bagian artikel yang paling cocok, semuanya diproses di browser Anda.'] };
    }
    if (/\bbisa (apa|ngapain|bantu)|apa yang bisa|cara (pakai|pakainya|menggunakan)|^bantuan|^help$/.test(bare)) {
      return { say: ['Tulis pertanyaan atau kata kunci dengan bahasa sehari-hari. Setelah jawaban muncul, ketik “lanjut” untuk bagian berikutnya, atau tanya “kalau yang itu?” untuk menyambung topik tadi. Tombol di bagian atas mengaktifkan pencarian makna dan mode obrolan (model bahasa lokal) bila file modelnya sudah dipasang.'], chips: someTopics(), chipLabel: 'Contoh topik:' };
    }
    if (bare.split(' ').length <= 5 && /\b(daftar|list)\b|apa saja (isi|artikel|yang (ada|dibahas))|isi wiki|ada artikel apa|ada apa saja|topik apa/.test(bare)) {
      return { say: ['Beberapa artikel di wiki ini:'], chips: titleChips(articles().slice(0, 8)), allLink: true };
    }

    const follow = !!last && (/\b(tadi|tersebut|dia|ia|kalau|lalu|terus)\b|(?<!apa |siapa )\bitu\b/.test(bare));
    let r = search(bare, follow ? last.slug : null);
    if (!r.qt.length) {
      return {
        say: ['Bisa lebih spesifik? Tulis nama topik atau kata kuncinya.'],
        chips: last ? [{ label: 'Lanjutkan “' + last.title + '”', q: 'lanjut' }] : someTopics()
      };
    }
    r = await hybrid(bare, r, follow ? last.slug : null);
    const gen = AI.useGen && AI.gen;
    if (!r.hits.length) {
      const n = noAnswer(r);
      if (gen) n.gen = { q: raw, hits: [] };
      return n;
    }

    const titles = [...new Set(r.hits.map(h => h.c.p.title))];
    const pg = r.hits[0].c.p;
    const same = r.hits.filter(h => h.c.p.slug === pg.slug);
    last = { slug: pg.slug, title: pg.title, shown: new Set(same.map(h => h.c.pos)), terms: r.terms };
    const chips = [];
    if ((pageChunks.get(pg.slug) || []).some(c => !last.shown.has(c.pos))) chips.push({ label: 'Lanjutkan membaca “' + pg.title + '”', q: 'lanjut' });
    for (const p of r.related) if (chips.length < 3) chips.push({ label: p.title, q: p.title });
    const res = {
      say: [titles.length === 1 ? 'Ini yang saya temukan di “' + titles[0] + '”:' : 'Ini yang saya temukan di ' + titles.length + ' artikel:'],
      hits: r.hits, terms: r.terms, loose: r.loose, sem: r.sem, chips, chipLabel: 'Lanjut atau lihat terkait:'
    };
    if (gen) res.gen = { q: raw, hits: r.hits };
    return res;
  }

  // ---------- Tampilan (DOM API, tanpa innerHTML untuk teks wiki) ----------
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function highlighted(text, qset) {
    const p = el('p');
    for (const part of text.split(/(\p{L}[\p{L}\p{N}_-]*)/u)) {
      if (!part) continue;
      const hit = /^\p{L}/u.test(part) && qset.has(stem(norm(part)));
      if (hit) p.appendChild(el('mark', null, part)); else p.appendChild(document.createTextNode(part));
    }
    return p;
  }

  function wikiHref(slug) { return '/#/' + encodeURIComponent(slug); }

  function appendHits(box, hits, qset) {
    for (const h of hits) {
      const card = el('div', 'hit');
      card.appendChild(highlighted(h.c.text, qset));
      const src = el('a', 'src', h.c.p.title); src.href = wikiHref(h.c.p.slug);
      card.appendChild(src);
      box.appendChild(card);
    }
  }

  function renderPlain(a, r) {
    for (const t of r.say || []) a.appendChild(el('p', 'say', t));
    if (r.hits && r.hits.length) {
      if (r.loose) a.appendChild(el('p', 'note', r.sem
        ? 'Dicocokkan berdasarkan makna kalimat, bukan hanya kata yang sama, jadi periksa apakah kutipannya sesuai.'
        : 'Pertanyaan dicocokkan secara longgar (salah ketik, sinonim, atau sebagian kata), jadi periksa apakah kutipannya sesuai.'));
      appendHits(a, r.hits, r.terms || new Set());
    }
  }

  function renderTail(a, r) {
    if (r.chips && r.chips.length) {
      const box = el('div', 'chips');
      if (r.chipLabel) box.appendChild(el('span', 'lbl', r.chipLabel));
      for (const ch of r.chips) {
        const b = el('button', 'chip', ch.label); b.type = 'button';
        b.addEventListener('click', () => ask(ch.q));
        box.appendChild(b);
      }
      a.appendChild(box);
    }
    if (r.allLink) {
      const p = el('p', 'note', 'Atau lihat ');
      const l = el('a', null, 'daftar semua halaman'); l.href = '/#/Khusus:Semua_halaman';
      p.appendChild(l); p.appendChild(document.createTextNode('.'));
      a.appendChild(p);
    }
  }

  async function renderGen(a, r, question) {
    const g = el('p', 'gen', 'Menulis jawaban…');
    a.appendChild(g);
    try {
      const text = await generate(r.gen.q, r.gen.hits, t => { g.textContent = t; });
      if (!text) throw new Error('jawaban kosong');
      g.textContent = text;
      history.push({ q: question, a: text });
      if (history.length > 6) history.shift();
      a.appendChild(el('p', 'note', r.gen.hits.length
        ? 'Dijawab model bahasa lokal berdasarkan kutipan wiki. Model kecil bisa keliru, jadi periksa kutipannya.'
        : 'Tidak ada kutipan wiki yang cocok, jadi jawaban ini tidak bersumber dari wiki.'));
      if (r.gen.hits.length) {
        const d = el('details', 'srcs');
        d.appendChild(el('summary', null, 'Kutipan sumber (' + r.gen.hits.length + ')'));
        appendHits(d, r.gen.hits, r.terms || new Set());
        a.appendChild(d);
      }
      return true;
    } catch (e) {
      console.error(e);
      g.remove();
      a.appendChild(el('p', 'note', 'Model obrolan gagal menjawab; menampilkan kutipan langsung.'));
      return false;
    }
  }

  async function addAnswer(question) {
    const msgs = $('msgs');
    const qEl = el('div', 'q', question);
    msgs.appendChild(qEl);
    const a = el('div', 'a');
    msgs.appendChild(a);
    qEl.scrollIntoView({ block: 'start' }); // tampilkan pertanyaan di atas, jawaban di bawahnya
    const wait = el('p', 'note', 'Mencari…');
    a.appendChild(wait);
    let r;
    try { r = await respond(question); }
    catch (e) { console.error(e); r = { say: ['Maaf, terjadi kesalahan saat mencari. Coba lagi.'] }; }
    wait.remove();
    let done = false;
    if (r.gen && AI.useGen && AI.gen) done = await renderGen(a, r, question);
    if (!done) renderPlain(a, r);
    renderTail(a, r);
  }

  function ask(q) {
    q = q.trim();
    if (!q || !ready || busy) return;
    busy = true;
    document.body.classList.add('chatting');
    for (const id of ['input', 'input2']) { $(id).value = ''; autosize($(id)); }
    syncButtons();
    addAnswer(q).catch(console.error).finally(() => { busy = false; syncButtons(); $('input2').focus(); });
  }

  function autosize(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 160) + 'px'; }
  function syncButtons() {
    $('send').disabled = !ready || busy || !$('input').value.trim();
    $('send2').disabled = !ready || busy || !$('input2').value.trim();
  }

  function setupSuggestions() {
    const ul = $('suggest');
    const arts = articles().sort(() => Math.random() - 0.5).slice(0, 3);
    for (const p of arts) {
      const li = el('li'), b = el('button'); b.type = 'button';
      b.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
      b.appendChild(document.createTextNode('Apa yang dibahas tentang ' + p.title + '?'));
      b.addEventListener('click', () => ask(p.title));
      li.appendChild(b); ul.appendChild(li);
    }
  }

  // ---------- Muat data ----------
  async function init() {
    try { cfg = { ...cfg, ...(await (await fetch('/config.json', { cache: 'no-cache' })).json()) }; } catch (e) {}
    cfg.contentBase = String(cfg.contentBase || '/wikis/').replace(/\/*$/, '/');
    $('brand').textContent = 'Tanya ' + (cfg.title || 'Wiki');
    document.title = 'Tanya ' + (cfg.title || 'Wiki');
    try {
      const idx = await (await fetch(cfg.contentBase + 'index.json', { cache: 'no-cache' })).json();
      pages = idx.pages || [];
      buildSyn(DEFAULT_SYN.concat(Array.isArray(cfg.synonyms) ? cfg.synonyms : []));
      buildIndex();
      ready = true;
      $('status').textContent = chunks.length ? pages.filter(p => !p.system).length + ' artikel siap' : 'Belum ada artikel';
      setupSuggestions();
      aiSetup();
    } catch (e) {
      $('status').textContent = 'Gagal memuat ' + cfg.contentBase + 'index.json';
    }
    syncButtons();
  }

  // ---------- Peristiwa ----------
  for (const [inp, form] of [['input', 'form'], ['input2', 'form2']]) {
    $(inp).addEventListener('input', () => { autosize($(inp)); syncButtons(); });
    $(inp).addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask($(inp).value); } });
    $(form).addEventListener('submit', e => { e.preventDefault(); ask($(inp).value); });
  }
  $('newChat').addEventListener('click', () => {
    $('msgs').replaceChildren();
    last = null; history = [];
    document.body.classList.remove('chatting');
    $('input').focus();
  });
  $('theme').addEventListener('click', () => {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = dark ? 'light' : 'dark';
  });

  // ---------- Mode popup ----------
  const qs = new URLSearchParams(location.search);
  if (qs.get('embed') === '1') document.body.classList.add('embed');
  const setTheme = t => { if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; };
  setTheme(qs.get('theme'));
  addEventListener('message', e => {
    if (e.origin !== location.origin || e.source !== parent) return;
    if (e.data && e.data.type === 'ask-theme') setTheme(e.data.theme);
  });
  // Di dalam popup, tautan ke artikel dibuka di halaman induk (bukan di dalam popup)
  document.addEventListener('click', e => {
    if (!document.body.classList.contains('embed')) return;
    const a = e.target.closest('a[href^="/#/"]');
    if (!a) return;
    e.preventDefault();
    parent.postMessage({ type: 'ask-open', hash: a.getAttribute('href').slice(1) }, location.origin);
  });

  init();
  $('input').focus();
})();
</script>
</body>
</html>
