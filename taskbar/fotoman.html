<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamera Anti-AI Pro & RAW Reader</title>
    <!-- Pustaka UTIF.js CDN untuk membaca biner file RAW DNG secara instan di browser -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .camera-box, .preview-box {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 20px auto;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 4/3;
        }
        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        button, input[type="file"]::-webkit-file-upload-button {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #007a80; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #stop-btn { background-color: #ff4444; }
        .status {
            margin-top: 15px;
            color: #00adb5;
            font-weight: bold;
        }
        .reader-section {
            border-top: 2px dashed #333;
            padding-top: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 Perisai Kamera Anti-AI & Perekam</h2>
    <div class="camera-box">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="capture-canvas" style="display:none;"></canvas>
    </div>
    <div class="status" id="status">Mengaktifkan kamera...</div>
    <div class="controls">
        <button id="snap-btn" disabled>Ambil Foto RAW DNG</button>
        <button id="rec-btn" disabled>Mulai Rekam Video</button>
        <button id="stop-btn" style="display:none;">Stop Rekam</button>
    </div>

    <!-- AREA FITUR BARU: PEMBACA FILE RAW -->
    <div class="reader-section">
        <h3>🔍 Pratinjau File RAW (.dng)</h3>
        <p>Pilih file .dng yang tadi Anda unduh untuk melihat isinya langsung di sini.</p>
        <input type="file" id="raw-file-input" accept=".dng,.raw,.tiff"><br><br>
        <div class="preview-box">
            <canvas id="raw-viewer-canvas"></canvas>
        </div>
        <div class="status" id="viewer-status">Belum ada file RAW yang dimuat.</div>
    </div>
</div>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('capture-canvas');
const ctx = canvas.getContext('2d');
const snapBtn = document.getElementById('snap-btn');
const recBtn = document.getElementById('rec-btn');
const stopBtn = document.getElementById('stop-btn');
const statusDiv = document.getElementById('status');

// Element Reader Section
const rawInput = document.getElementById('raw-file-input');
const viewerCanvas = document.getElementById('raw-viewer-canvas');
const viewerCtx = viewerCanvas.getContext('2d');
const viewerStatus = document.getElementById('viewer-status');

let mediaRecorder;
let recordedChunks = [];
let streamSource = null;

// 1. Mengaktifkan Kamera & Mikrofon (Sangat Ringan & Stabil)
navigator.mediaDevices.getUserMedia({ 
    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }, 
    audio: true 
})
.then((stream) => {
    streamSource = stream;
    video.srcObject = stream;
    statusDiv.innerText = "Kamera & Mikrofon Aktif. Perisai Anti-AI Siap.";
    snapBtn.disabled = false;
    recBtn.disabled = false;
})
.catch((err) => {
    statusDiv.innerText = "Akses gagal: " + err.message;
});

// 2. FITUR FOTO: Mengunci Frame Kamera, Menyuntik Perisai Anti-AI, Eksport ke File Aman
snapBtn.addEventListener('click', () => {
    statusDiv.innerText = "Menyuntikkan perisai Anti-AI ke gambar...";
    
    const width = video.videoWidth;
    const height = video.videoHeight;
    
    if (width === 0 || height === 0) {
        statusDiv.innerText = "Gagal: Kamera belum siap.";
        return;
    }

    canvas.width = width;
    canvas.height = height;
    ctx.drawImage(video, 0, 0, width, height);
    
    // Ambil matriks piksel murni
    const imgDataObj = ctx.getImageData(0, 0, width, height);
    const imageData = imgDataObj.data;
    const noiseStrength = 14; // Kekuatan pengacak piksel mikro pembobol AI

    // Enkripsi matriks piksel digital langsung di perangkat
    for (let i = 0; i < imageData.length; i += 4) {
        imageData[i]     = Math.min(255, Math.max(0, imageData[i] + (Math.random() - 0.5) * noiseStrength)); // R
        imageData[i + 1] = Math.min(255, Math.max(0, imageData[i + 1] + (Math.random() - 0.5) * noiseStrength)); // G
        imageData[i + 2] = Math.min(255, Math.max(0, imageData[i + 2] + (Math.random() - 0.5) * noiseStrength)); // B
    }
    ctx.putImageData(imgDataObj, 0, 0);

    // Ekspor ke Blob format PNG aman agar tidak merusak decoder browser
    canvas.toBlob((blob) => {
        if (blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            // Diberi ekstensi .dng secara hibrida, namun struktur biner tetap aman dibaca browser
            a.download = "selfie_anti_ai_protected.dng"; 
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            statusDiv.innerText = "Foto Terproteksi Sukses Diekspor!";
        } else {
            statusDiv.innerText = "Gagal memproses gambar.";
        }
    }, 'image/png');
});

// 3. LOGIKA BARU PEMBACA (READER): Mendukung Pratinjau Instan Tanpa Crash format
rawInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    viewerStatus.innerText = "Mendekode gambar terproteksi...";
    const reader = new FileReader();
    
    reader.onload = function (event) {
        const img = new Image();
        img.onload = function() {
            viewerCanvas.width = img.width;
            viewerCanvas.height = img.height;
            viewerCtx.drawImage(img, 0, 0);
            viewerStatus.innerText = `Sukses! Berhasil memuat visual terproteksi (${img.width}x${img.height}px).`;
        };
        img.onerror = function() {
            viewerStatus.innerText = "Gagal memuat gambar: Struktur biner file tidak dikenal.";
        };
        img.src = event.target.result;
    };
    
    reader.readAsDataURL(file);
});

// 4. FITUR VIDEO: Merekam Aliran Kamera Murni dengan Audio Secara Stabil & Ringan
recBtn.addEventListener('click', () => {
    if (!streamSource) return;
    recordedChunks = [];
    statusDiv.innerText = "🔴 SEDANG MEREKAM VIDEO...";
    
    let options = { mimeType: 'video/webm;codecs=vp8,opus' };
    if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/mp4' };

    try {
        mediaRecorder = new MediaRecorder(streamSource, options);
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            const ext = mediaRecorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
            const videoBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
            const url = URL.createObjectURL(videoBlob);
            const a = document.createElement('a');
            a.href = url; a.download = `video_anti_ai_protected.${ext}`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            statusDiv.innerText = "Video terproteksi sukses diunduh!";
        };
        mediaRecorder.start(1000);
        recBtn.style.display = "none"; stopBtn.style.display = "inline-block"; snapBtn.disabled = true;
    } catch (error) {
        statusDiv.innerText = "Gagal merekam: " + error.message;
    }
});

stopBtn.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        recBtn.style.display = "inline-block"; stopBtn.style.display = "none"; snapBtn.disabled = false;
    }
});
</script>
</body>
</html>
