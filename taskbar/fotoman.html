<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamera Anti-AI & RAW Eksportir</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .camera-box {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 20px auto;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 4/3;
        }
        video, canvas, #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        button:hover { background-color: #007a80; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #stop-btn { background-color: #ff4444; }
        #stop-btn:hover { background-color: #cc0000; }
        .status {
            margin-top: 15px;
            color: #00adb5;
            font-weight: bold;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Perisai Kamera Anti-AI & RAW Pro</h2>
    <p>Ambil Foto RAW DNG atau Rekam Video Terproteksi langsung dari Kamera Anda.</p>
    
    <div class="camera-box">
        <!-- Elemen video tersembunyi, kita tampilkan lewat canvas yang di-cloak -->
        <video id="webcam" autoplay playsinline style="display:none;"></video>
        <canvas id="viewfinder"></canvas>
    </div>
    
    <div class="status" id="status">Menginisialisasi kamera...</div>
    
    <div class="controls">
        <button id="snap-btn" disabled>Ambil Foto RAW DNG</button>
        <button id="rec-btn" disabled>Mulai Rekam Video</button>
        <button id="stop-btn" style="display:none;">Stop Rekam</button>
    </div>
</div>

<script>
const video = document.getElementById('webcam');
const viewfinder = document.getElementById('viewfinder');
const ctx = viewfinder.getContext('2d');
const snapBtn = document.getElementById('snap-btn');
const recBtn = document.getElementById('rec-btn');
const stopBtn = document.getElementById('stop-btn');
const statusDiv = document.getElementById('status');

let mediaRecorder;
let recordedChunks = [];
let videoStream;      
let microphoneStream; 
let isRecording = false;
const noiseStrength = 10; // Kekuatan perisai acak mikro (bisa dinaikkan jika kurang aman)

// 1. Aktifkan Kamera SAJA di Awal (Mikrofon tetap Mati)
navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false })
    .then((stream) => {
        videoStream = stream;
        video.srcObject = stream;
        statusDiv.innerText = "Kamera aktif (Mikrofon mati). Wajah Anda dilindungi...";
        snapBtn.disabled = false;
        recBtn.disabled = false;
        requestAnimationFrame(renderFrame);
    })
    .catch((err) => {
        statusDiv.innerText = "Gagal mengakses kamera: " + err.message;
    });

// 2. Mengacak Piksel Pratinjau Kamera secara Real-Time (Anti-Scraping AI)
function renderFrame() {
    if (video.readyState === video.HAVE_CURRENT_DATA) {
        viewfinder.width = video.videoWidth;
        viewfinder.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, viewfinder.width, viewfinder.height);

        const imageData = ctx.getImageData(0, 0, viewfinder.width, viewfinder.height);
        const data = imageData.data;

        for (let i = 0; i < data.length; i += 4) {
            data[i]     = Math.min(255, Math.max(0, data[i] + (Math.random() - 0.5) * noiseStrength)); // R
            data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + (Math.random() - 0.5) * noiseStrength)); // G
            data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + (Math.random() - 0.5) * noiseStrength)); // B
        }
        ctx.putImageData(imageData, 0, 0);
    }
    requestAnimationFrame(renderFrame);
}

// 3. FITUR FOTO: Menggunakan PNG Ultra-HD + Cloaking (Anti-Gagal & Ringan)
snapBtn.addEventListener('click', () => {
    statusDiv.innerText = "Mengunci frame terproteksi...";
    
    // Langsung konversi kanvas ter-cloak saat ini ke file gambar resmi browser
    viewfinder.toBlob((blob) => {
        if (blob) {
            downloadFile(blob, "selfie_anti_ai.png");
            statusDiv.innerText = "Foto PNG Anti-AI sukses diunduh!";
        } else {
            statusDiv.innerText = "Gagal menangkap gambar.";
        }
    }, 'image/png');
});

// 4. FITUR VIDEO: Merekam Video + Aktifkan Suara Mikrofon Hanya Saat Merekam
recBtn.addEventListener('click', async () => {
    recordedChunks = [];
    statusDiv.innerText = "Mengaktifkan mikrofon...";

    try {
        // Nyalakan mikrofon tepat saat tombol rekam diklik
        microphoneStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // Tangkap visual dari kanvas yang sudah diacak
        const canvasStream = viewfinder.captureStream(30); 

        // Gabungkan trek audio ke dalam rekaman video
        if (microphoneStream && microphoneStream.getAudioTracks().length > 0) {
            canvasStream.addTrack(microphoneStream.getAudioTracks()[0]);
        }

        // Gunakan WebM (VP8/Opus) yang kompatibel penuh di hampir semua browser modern
        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp8,opus' });

        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
            downloadFile(videoBlob, "video_anti_ai.webm");
            statusDiv.innerText = "Video terproteksi sukses diunduh!";
            
            // MATIKAN TOTAL MIKROFON setelah rekaman video berhenti
            if (microphoneStream) {
                microphoneStream.getTracks().forEach(track => track.stop());
                console.log("Mikrofon dimatikan untuk privasi.");
            }
        };

        mediaRecorder.start();
        isRecording = true;
        statusDiv.innerText = "🔴 SEDANG MEREKAM VIDEO & AUDIO ANTI-AI...";
        recBtn.style.display = "none";
        stopBtn.style.display = "inline-block";
        snapBtn.disabled = true;

    } catch (err) {
        statusDiv.innerText = "Gagal mengaktifkan perekaman suara: " + err.message;
    }
});

// 5. Menghentikan Rekaman Video
stopBtn.addEventListener('click', () => {
    if (isRecording && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.style.display = "inline-block";
        stopBtn.style.display = "none";
        snapBtn.disabled = false;
    }
});

function downloadFile(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
</script>
</body>
</html>
