<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamera Anti-AI & RAW Eksportir</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .camera-box {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 20px auto;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 4/3;
        }
        video, canvas, #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        button:hover { background-color: #007a80; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #stop-btn { background-color: #ff4444; }
        #stop-btn:hover { background-color: #cc0000; }
        .status {
            margin-top: 15px;
            color: #00adb5;
            font-weight: bold;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Perisai Kamera Anti-AI & RAW Pro</h2>
    <p>Ambil Foto RAW DNG atau Rekam Video Terproteksi langsung dari Kamera Anda.</p>
    
    <div class="camera-box">
        <!-- Elemen video tersembunyi, kita tampilkan lewat canvas yang di-cloak -->
        <video id="webcam" autoplay playsinline style="display:none;"></video>
        <canvas id="viewfinder"></canvas>
    </div>
    
    <div class="status" id="status">Menginisialisasi kamera...</div>
    
    <div class="controls">
        <button id="snap-btn" disabled>Ambil Foto RAW DNG</button>
        <button id="rec-btn" disabled>Mulai Rekam Video</button>
        <button id="stop-btn" style="display:none;">Stop Rekam</button>
    </div>
</div>

<script>
const video = document.getElementById('webcam');
const viewfinder = document.getElementById('viewfinder');
const ctx = viewfinder.getContext('2d');
const snapBtn = document.getElementById('snap-btn');
const recBtn = document.getElementById('rec-btn');
const stopBtn = document.getElementById('stop-btn');
const statusDiv = document.getElementById('status');

let mediaRecorder;
let recordedChunks = [];
let videoStream;      // Menyimpan stream kamera murni
let microphoneStream; // Menyimpan stream mikrofon (hanya aktif saat merekam)
let isRecording = false;
const noiseStrength = 8; // Kekuatan perisai anti-AI

// 1. Mengaktifkan Kamera SAJA di Awal (Tanpa Audio)
navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false })
    .then((stream) => {
        videoStream = stream;
        video.srcObject = stream;
        statusDiv.innerText = "Kamera aktif (Mikrofon mati). Melindungi pratinjau wajah...";
        snapBtn.disabled = false;
        recBtn.disabled = false;

        // Mulai render frame video dengan suntikan cloaking secara real-time
        requestAnimationFrame(renderFrame);
    })
    .catch((err) => {
        statusDiv.innerText = "Gagal mengakses kamera: " + err.message;
    });

// 2. Loop Menggambar ke Canvas + Suntik Noise Anti-AI Real-Time
function renderFrame() {
    if (video.readyState === video.HAVE_CURRENT_DATA) {
        viewfinder.width = video.videoWidth;
        viewfinder.height = video.videoHeight;

        ctx.drawImage(video, 0, 0, viewfinder.width, viewfinder.height);

        const imageData = ctx.getImageData(0, 0, viewfinder.width, viewfinder.height);
        const data = imageData.data;

        for (let i = 0; i < data.length; i += 4) {
            data[i]     = Math.min(255, Math.max(0, data[i] + (Math.random() - 0.5) * noiseStrength));     // R
            data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + (Math.random() - 0.5) * noiseStrength)); // G
            data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + (Math.random() - 0.5) * noiseStrength)); // B
        }
        ctx.putImageData(imageData, 0, 0);
    }
    requestAnimationFrame(renderFrame);
}

// 3. FITUR FOTO: Mengonversi Frame Menjadi File RAW DNG Terproteksi
snapBtn.addEventListener('click', () => {
    statusDiv.innerText = "Membekukan frame dan merakit struktur RAW DNG...";

    const width = viewfinder.width;
    const height = viewfinder.height;
    
    if (width === 0 || height === 0) {
        statusDiv.innerText = "Gagal: Kamera belum siap.";
        return;
    }

    const imgDataObj = ctx.getImageData(0, 0, width, height);
    const imageData = imgDataObj.data;

    const pixelDataSize = width * height * 3; 
    const headerAndIfdSize = 250; 
    
    const buffer = new ArrayBuffer(headerAndIfdSize + pixelDataSize);
    const view = new DataView(buffer);
    const uint8View = new Uint8Array(buffer);

    view.setUint16(0, 0x4949, true); 
    view.setUint16(2, 42, true);     
    view.setUint32(4, 8, true);      

    let offset = 8;
    view.setUint16(offset, 9, true); 
    offset += 2;

    const writeTag = (tag, type, count, value) => {
        view.setUint16(offset, tag, true);
        view.setUint16(offset + 2, type, true);
        view.setUint32(offset + 4, count, true);
        view.setUint32(offset + 8, value, true);
        offset += 12;
    };

    const bitsPerSampleOffset = 180; 
    view.setUint16(bitsPerSampleOffset, 8, true);
    view.setUint16(bitsPerSampleOffset + 2, 8, true);
    view.setUint16(bitsPerSampleOffset + 4, 8, true);

    writeTag(256, 4, 1, width);               
    writeTag(257, 4, 1, height);              
    writeTag(258, 3, 3, bitsPerSampleOffset);  
    writeTag(259, 3, 1, 1);                   
    writeTag(262, 3, 1, 2);                   
    writeTag(273, 4, 1, headerAndIfdSize);    
    writeTag(277, 3, 1, 3);                   
    writeTag(278, 4, 1, height);              
    writeTag(279, 4, 1, pixelDataSize);       

    view.setUint32(offset, 0, true); 

    let pixelOffset = headerAndIfdSize;
    for (let i = 0; i < imageData.length; i += 4) {
        uint8View[pixelOffset]     = imageData[i];     
        uint8View[pixelOffset + 1] = imageData[i + 1]; 
        uint8View[pixelOffset + 2] = imageData[i + 2]; 
        pixelOffset += 3;
    }

    const dngBlob = new Blob([buffer], { type: 'image/x-adobe-dng' });
    downloadFile(dngBlob, "selfie_protected.dng");
    statusDiv.innerText = "Foto RAW DNG berhasil diunduh!";
});

// 4. FITUR VIDEO: Aktifkan Mikrofon Hanya Saat Tombol Rekam Ditekan
recBtn.addEventListener('click', async () => {
    recordedChunks = [];
    statusDiv.innerText = "Meminta akses mikrofon...";

    try {
        // Minta akses ke mikrofon secara terpisah tepat saat rekaman dimulai
        microphoneStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // Ambil aliran gambar dari canvas terlindungi
        const canvasStream = viewfinder.captureStream(30); 

        // Masukkan trek audio mikrofon ke dalam rekaman canvas
        if (microphoneStream.getAudioTracks().length > 0) {
            const audioTrack = microphoneStream.getAudioTracks()[0];
            canvasStream.addTrack(audioTrack);
        }

        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp8,opus' });

        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
            downloadFile(videoBlob, "video_protected.webm");
            statusDiv.innerText = "Video terproteksi berhasil diunduh!";
            
            // PENTING: Matikan total lampu/daya mikrofon setelah rekaman selesai
            if (microphoneStream) {
                microphoneStream.getTracks().forEach(track => track.stop());
                console.log("Mikrofon berhasil dimatikan kembali.");
            }
        };

        mediaRecorder.start();
        isRecording = true;
        statusDiv.innerText = "🔴 SEDANG MEREKAM VIDEO & SUARA MIKROFON...";
        recBtn.style.display = "none";
        stopBtn.style.display = "inline-block";
        snapBtn.disabled = true;

    } catch (err) {
        statusDiv.innerText = "Gagal mengaktifkan mikrofon: " + err.message;
        console.error(err);
    }
});

// 5. Menghentikan Rekaman
stopBtn.addEventListener('click', () => {
    if (isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.style.display = "inline-block";
        stopBtn.style.display = "none";
        snapBtn.disabled = false;
    }
});

function downloadFile(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}
</script>
</body>
</html>
