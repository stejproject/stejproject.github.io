<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamera Anti-AI & Perekam Video</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .camera-box {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 20px auto;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 4/3;
        }
        /* PERISAI ANTI-AI: Filter CSS untuk merusak pembacaan pola wajah oleh AI */
        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(160%) brightness(95%) saturate(140%) blur(0.5px);
        }
        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #007a80; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #stop-btn { background-color: #ff4444; }
        #stop-btn:hover { background-color: #cc0000; }
        .status {
            margin-top: 15px;
            color: #00adb5;
            font-weight: bold;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Perisai Kamera Anti-AI & Perekam</h2>
    <p>Ambil Foto Terproteksi atau Rekam Video langsung dari Browser.</p>
    
    <div class="camera-box">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="capture-canvas" style="display:none;"></canvas>
    </div>
    
    <div class="status" id="status">Mengaktifkan kamera...</div>
    
    <div class="controls">
        <button id="snap-btn" disabled>Ambil Foto Anti-AI</button>
        <button id="rec-btn" disabled>Mulai Rekam Video</button>
        <button id="stop-btn" style="display:none;">Stop Rekam</button>
    </div>
</div>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('capture-canvas');
const ctx = canvas.getContext('2d');
const snapBtn = document.getElementById('snap-btn');
const recBtn = document.getElementById('rec-btn');
const stopBtn = document.getElementById('stop-btn');
const statusDiv = document.getElementById('status');

let mediaRecorder;
let recordedChunks = [];
let streamSource = null;

// 1. Mengaktifkan Kamera & Mikrofon Secara Bersamaan Sejak Awal (Paling Stabil)
navigator.mediaDevices.getUserMedia({ 
    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }, 
    audio: true 
})
.then((stream) => {
    streamSource = stream;
    video.srcObject = stream;
    statusDiv.innerText = "Kamera & Mikrofon Aktif. Wajah Anda Terlindungi.";
    snapBtn.disabled = false;
    recBtn.disabled = false;
})
.catch((err) => {
    statusDiv.innerText = "Akses ditolak/gagal: " + err.message;
    console.error(err);
});

// 2. FITUR FOTO: Mengunci Frame Kamera & Mengunduh sebagai PNG Murni (Anti-Gagal)
snapBtn.addEventListener('click', () => {
    statusDiv.innerText = "Mengambil foto...";
    
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    // Terapkan filter anti-AI bawaan browser ke hasil foto canvas
    ctx.filter = getComputedStyle(video).filter;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    canvas.toBlob((blob) => {
        if (blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "foto_terproteksi_anti_ai.png";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            statusDiv.innerText = "Foto terproteksi berhasil diunduh!";
        } else {
            statusDiv.innerText = "Gagal mengambil gambar.";
        }
    }, 'image/png');
});

// 3. FITUR VIDEO: Merekam Aliran Kamera Langsung dengan Suara Tanpa Script Crash
recBtn.addEventListener('click', () => {
    if (!streamSource) return;
    
    recordedChunks = [];
    statusDiv.innerText = "🔴 SEDANG MEREKAM VIDEO...";
    
    // Gunakan konfigurasi format dasar webm/mp4 bawaan browser yang sangat ringan
    let options = { mimeType: 'video/webm;codecs=vp8,opus' };
    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/mp4' }; // Fallback otomatis untuk iOS/Safari
    }

    try {
        mediaRecorder = new MediaRecorder(streamSource, options);
        
        mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) {
                recordedChunks.push(e.data);
            }
        };

        mediaRecorder.onstop = () => {
            const ext = mediaRecorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
            const videoBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
            const url = URL.createObjectURL(videoBlob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `video_terproteksi_anti_ai.${ext}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            statusDiv.innerText = "Video terproteksi berhasil diunduh!";
        };

        mediaRecorder.start(1000); // Rekam dan simpan data setiap 1 detik agar memori stabil
        
        recBtn.style.display = "none";
        stopBtn.style.display = "inline-block";
        snapBtn.disabled = true;

    } catch (error) {
        statusDiv.innerText = "Gagal merekam: " + error.message;
        console.error(error);
    }
});

// 4. MENGHENTIKAN REKAMAN VIDEO
stopBtn.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        recBtn.style.display = "inline-block";
        stopBtn.style.display = "none";
        snapBtn.disabled = false;
    }
});
</script>
</body>
</html>
