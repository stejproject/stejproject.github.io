<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEJ CyberCrypt - Universal Obfuscator Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
    .code-font { font-family: 'Fira Code', monospace; }
    .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen p-6">
  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Header -->
    <header class="flex items-center justify-between border-b border-gray-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-red-500 via-orange-400 to-amber-300 bg-clip-text text-transparent">
          STEJ CyberCrypt :: Universal Obfuscator
        </h1>
        <p class="text-xs text-gray-400 mt-1">Modul Enkripsi Ganda: Teks Rahasia & Kode Program (STEJ Project)</p>
      </div>
      <span class="px-3 py-1 text-xs rounded-full bg-red-500/10 text-red-400 border border-red-500/20 font-mono">SECURE SUITE v2.0</span>
    </header>

    <!-- Mode Selector Tab -->
    <div class="flex space-x-3">
      <button onclick="switchTab('text')" id="tabTextBtn" class="px-5 py-2.5 text-xs font-bold rounded-lg bg-gradient-to-r from-red-600 to-orange-600 text-white shadow-lg shadow-red-900/30 transition-all">
        🔤 Obfuscate Teks / Pesan
      </button>
      <button onclick="switchTab('code')" id="tabCodeBtn" class="px-5 py-2.5 text-xs font-bold rounded-lg bg-gray-900 text-gray-400 hover:text-white border border-gray-800 transition-all">
        💻 Obfuscate Kode (JS/CSS)
      </button>
    </div>

    <!-- TAB 1: TEXT OBFUSCATOR -->
    <div id="textSection" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="glass-card p-4 rounded-xl space-y-3">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-gray-300 uppercase">Input Teks / Pesan Asli</span>
          <select id="textMode" class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-gray-200">
            <option value="base64">Base64 Encode</option>
            <option value="hex">Hexadecimal</option>
            <option value="reverse">Reverse & Shuffle</option>
          </select>
        </div>
        <textarea id="rawTextInput" class="w-full h-80 bg-gray-950 text-emerald-400 code-font p-4 text-xs rounded-lg border border-gray-800 focus:outline-none focus:border-red-500 resize-none" placeholder="Tulis catatan, pesan rahasia, atau teks biasa di sini..."></textarea>
        <button onclick="processTextObfuscate()" class="w-full py-2.5 text-xs font-bold rounded-lg bg-red-600 hover:bg-red-500 text-white transition-all">
          Obfuscate Teks 🔒
        </button>
      </div>

      <div class="glass-card p-4 rounded-xl space-y-3">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-gray-300 uppercase">Hasil Obfuscated Text</span>
          <button onclick="copyTextOutput()" class="text-xs text-amber-400 hover:underline">Salin Hasil</button>
        </div>
        <textarea id="obfuscatedTextOutput" readonly class="w-full h-80 bg-gray-950 text-amber-300 code-font p-4 text-xs rounded-lg border border-gray-800 focus:outline-none resize-none" placeholder="Hasil sandi teks akan muncul di sini..."></textarea>
      </div>
    </div>

    <!-- TAB 2: CODE OBFUSCATOR (Hidden by default) -->
    <div id="codeSection" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
      <div class="glass-card p-4 rounded-xl space-y-3">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-gray-300 uppercase">Input Kode JavaScript / CSS</span>
          <button onclick="loadCodeSample()" class="text-xs text-red-400 hover:underline">Muat Contoh Kode</button>
        </div>
        <textarea id="rawCodeInput" class="w-full h-80 bg-gray-950 text-emerald-400 code-font p-4 text-xs rounded-lg border border-gray-800 focus:outline-none focus:border-red-500 resize-none" placeholder="// Masukkan kode bersih di sini..."></textarea>
        <button onclick="processCodeObfuscate()" class="w-full py-2.5 text-xs font-bold rounded-lg bg-orange-600 hover:bg-orange-500 text-white transition-all">
          Obfuscate Kode 🔒
        </button>
      </div>

      <div class="glass-card p-4 rounded-xl space-y-3">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-gray-300 uppercase">Hasil Obfuscated Code</span>
          <button onclick="copyCodeOutput()" class="text-xs text-amber-400 hover:underline">Salin Kode</button>
        </div>
        <textarea id="obfuscatedCodeOutput" readonly class="w-full h-80 bg-gray-950 text-amber-300 code-font p-4 text-xs rounded-lg border border-gray-800 focus:outline-none resize-none" placeholder="Hasil kode acak-adul akan muncul di sini..."></textarea>
      </div>
    </div>
  </div>

  <script>
    // Tab Switching Logic
    function switchTab(type) {
      const textSec = document.getElementById('textSection');
      const codeSec = document.getElementById('codeSection');
      const textBtn = document.getElementById('tabTextBtn');
      const codeBtn = document.getElementById('tabCodeBtn');

      if (type === 'text') {
        textSec.classList.remove('hidden');
        codeSec.classList.add('hidden');
        textBtn.className = "px-5 py-2.5 text-xs font-bold rounded-lg bg-gradient-to-r from-red-600 to-orange-600 text-white shadow-lg shadow-red-900/30 transition-all";
        codeBtn.className = "px-5 py-2.5 text-xs font-bold rounded-lg bg-gray-900 text-gray-400 hover:text-white border border-gray-800 transition-all";
      } else {
        codeSec.classList.remove('hidden');
        textSec.classList.add('hidden');
        codeBtn.className = "px-5 py-2.5 text-xs font-bold rounded-lg bg-gradient-to-r from-red-600 to-orange-600 text-white shadow-lg shadow-red-900/30 transition-all";
        textBtn.className = "px-5 py-2.5 text-xs font-bold rounded-lg bg-gray-900 text-gray-400 hover:text-white border border-gray-800 transition-all";
      }
    }

    // Text Obfuscation Handler
    function processTextObfuscate() {
      const text = document.getElementById('rawTextInput').value;
      const mode = document.getElementById('textMode').value;
      if (!text) return alert("Masukkan teks terlebih dahulu!");

      let result = "";
      if (mode === 'base64') {
        result = btoa(unescape(encodeURIComponent(text)));
      } else if (mode === 'hex') {
        result = text.split('').map(c => '\\x' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
      } else if (mode === 'reverse') {
        result = text.split('').reverse().join('').split('').map(c => c.charCodeAt(0).toString(36)).join('-');
      }

      document.getElementById('obfuscatedTextOutput').value = result;
    }

    // Code Obfuscation Handler
    function loadCodeSample() {
      document.getElementById('rawCodeInput').value = `function tampilkanPesan() {\n    let pesan = "Selamat Datang di STEJ Project";\n    console.log(pesan);\n}\ntampilkanPesan();`;
    }

    function processCodeObfuscate() {
      const code = document.getElementById('rawCodeInput').value;
      if (!code) return alert("Masukkan kode JavaScript terlebih dahulu!");

      // Simulasi Obfuscation: Minify + Variable Renaming + String Hex
      let result = code.replace(/function\s+([a-zA-Z0-9_]+)/g, () => `function _0x${Math.floor(Math.random()*0xffffff).toString(16)}`)
                       .replace(/let\s+([a-zA-Z0-9_]+)/g, () => `let _0x${Math.floor(Math.random()*0xffffff).toString(16)}`)
                       .replace(/"([^"]*)"/g, (m, p1) => `"${p1.split('').map(c => '\\x' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('')}"`)
                       .replace(/\s+/g, ' ');

      document.getElementById('obfuscatedCodeOutput').value = result;
    }

    function copyTextOutput() {
      const out = document.getElementById('obfuscatedTextOutput');
      if(!out.value) return;
      navigator.clipboard.writeText(out.value);
      alert("Teks sandi berhasil disalin!");
    }

    function copyCodeOutput() {
      const out = document.getElementById('obfuscatedCodeOutput');
      if(!out.value) return;
      navigator.clipboard.writeText(out.value);
      alert("Kode obfuskasi berhasil disalin!");
    }
  </script>
</body>
</html>
