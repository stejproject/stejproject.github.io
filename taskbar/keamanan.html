<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEJ CyberCrypt - Obfuscator Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
    .code-font { font-family: 'Fira Code', monospace; }
    .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen p-6">
  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Header -->
    <header class="flex items-center justify-between border-b border-gray-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-red-500 via-orange-400 to-amber-300 bg-clip-text text-transparent">
          STEJ CyberCrypt :: Obfuscator Engine
        </h1>
        <p class="text-xs text-gray-400 mt-1">Sistem Pengacak Kode & Obfuskasi Lapis Ganda (STEJ Project)</p>
      </div>
      <span class="px-3 py-1 text-xs rounded-full bg-red-500/10 text-red-400 border border-red-500/20 font-mono">CONFIDENTIAL / INTERNAL USE</span>
    </header>

    <!-- Control Panel & Options -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="glass-card p-4 rounded-xl">
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Tingkat Acak (Mode)</label>
        <select id="modeSelect" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-gray-200 focus:outline-none focus:border-red-500">
          <option value="light">Ringan (Minify + Hex Encode String)</option>
          <option value="medium" selected>Menengah (Variable Renaming + Hex)</option>
          <option value="extreme">Ekstrem (Control Flow Flattening + Base64 Wrap)</option>
        </select>
      </div>

      <div class="glass-card p-4 rounded-xl flex items-center justify-between">
        <div>
          <span class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Metrik Kompleksitas</span>
          <span id="complexityText" class="text-lg font-bold text-amber-400 mt-1 block">Medium (Level 2)</span>
        </div>
        <div class="w-12 h-12 rounded-full border-2 border-amber-400/30 flex items-center justify-center bg-amber-400/10 text-amber-400 text-xs font-bold" id="complexityBadge">
          L2
        </div>
      </div>

      <div class="glass-card p-4 rounded-xl flex items-center justify-end space-x-3">
        <button onclick="clearAll()" class="px-4 py-2.5 text-xs font-semibold text-gray-400 hover:text-white transition-colors">Reset</button>
        <button onclick="runObfuscate()" class="px-6 py-2.5 text-xs font-bold rounded-lg bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 text-white shadow-lg shadow-red-900/30 transition-all transform active:scale-95">
          LOCK & OBFUSCATE 🔒
        </button>
      </div>
    </div>

    <!-- Main Workspace -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Input -->
      <div class="glass-card p-4 rounded-xl space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-gray-300 uppercase">Input JavaScript Asli</span>
          <button onclick="loadSample()" class="text-xs text-red-400 hover:underline">Muat Contoh Kode STEJ</button>
        </div>
        <textarea id="rawInput" class="w-full h-96 bg-gray-950 text-emerald-400 code-font p-4 text-xs rounded-lg border border-gray-800 focus:outline-none focus:border-red-500 resize-none" placeholder="// Masukkan kode JavaScript bersih kamu di sini..."></textarea>
      </div>

      <!-- Output -->
      <div class="glass-card p-4 rounded-xl space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-gray-300 uppercase">Hasil Obfuscation (Kode Alien)</span>
          <button onclick="copyOutput()" class="text-xs text-amber-400 hover:underline">Salin Kode</button>
        </div>
        <textarea id="obfuscatedOutput" readonly class="w-full h-96 bg-gray-950 text-amber-300 code-font p-4 text-xs rounded-lg border border-gray-800 focus:outline-none resize-none" placeholder="// Hasil kode yang sudah di-obfuscate akan muncul di sini..."></textarea>
      </div>
    </div>
  </div>

  <script>
    function loadSample() {
      document.getElementById('rawInput').value = `// STEJ Project Core Logic\nfunction hitungTotalInvestasi(modal, bunga) {\n    let total = modal + (modal * (bunga / 100));\n    console.log("Total Proyeksi STEJ: " + total);\n    return total;\n}\nhitungTotalInvestasi(10000000, 12);`;
    }

    function runObfuscate() {
      const code = document.getElementById('rawInput').value.trim();
      const mode = document.getElementById('modeSelect').value;
      if(!code) return alert("Masukkan kode JavaScript terlebih dahulu!");

      let result = code;

      if (mode === 'light') {
        // Minify + Hex Encode String sederha
        result = code.replace(/\/\*[\s\S]*?\*\/|([^:]|^)\/\/.*/g, '')
                     .replace(/\s+/g, ' ')
                     .replace(/"([^"]*)"/g, (m, p1) => `"${encodeHex(p1)}"`);
      } else if (mode === 'medium') {
        // Variable Renaming + Hex String
        result = code.replace(/function\s+([a-zA-Z0-9_]+)/g, (m, name) => `function _0x${Math.floor(Math.random()*0xffffff).toString(16)}`)
                     .replace(/let\s+([a-zA-Z0-9_]+)/g, (m, name) => `let _0x${Math.floor(Math.random()*0xffffff).toString(16)}`)
                     .replace(/"([^"]*)"/g, (m, p1) => `"${encodeHex(p1)}"`)
                     .replace(/\s+/g, ' ');
      } else if (mode === 'extreme') {
        // Base64 Evaluator Wrapper (Control Flow Flattening Simulation)
        const b64 = btoa(code);
        result = `(function(_0x1a2b,_0x3c4d){var _0x5e6f=function(_0x7a8b){return atob(_0x7a8b);};eval(_0x5e6f("${b64}"));})();`;
      }

      document.getElementById('obfuscatedOutput').value = result;
    }

    function encodeHex(str) {
      return str.split('').map(c => '\\x' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
    }

    function clearAll() {
      document.getElementById('rawInput').value = '';
      document.getElementById('obfuscatedOutput').value = '';
    }

    function copyOutput() {
      const out = document.getElementById('obfuscatedOutput');
      if(!out.value) return;
      navigator.clipboard.writeText(out.value);
      alert("Kode Obfuscation berhasil disalin!");
    }
  </script>
</body>
</html>
